version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: omnilexis_db
    environment:
      POSTGRES_USER: omnilexis
      POSTGRES_PASSWORD: omnilexis
      POSTGRES_DB: omnilexis
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnilexis"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omnilexis-network

  redis:
    image: redis:7-alpine
    container_name: omnilexis_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omnilexis-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omnilexis_backend
    environment:
      DATABASE_URL: postgresql://omnilexis:omnilexis@db:5432/omnilexis
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/alembic:/app/alembic
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - omnilexis-network
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: omnilexis_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - omnilexis-network

volumes:
  postgres_data:
  redis_data:

networks:
  omnilexis-network:
    driver: bridge
